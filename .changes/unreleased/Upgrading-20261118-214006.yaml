kind: Upgrading
body: |-
    **Check that the recorder and the checkpoint builder can verify what
    the journal holds.** A `CompactJwsAuditSigner` over a private JWK, a
    `KeyObject` or an extractable `CryptoKey` now verifies the stored
    entries they build on by default, and a builder that signs with another
    key than the recorder's then refuses until it is given a `signatures`
    verifier that resolves the recorder's key. A signer over a
    non-extractable `CryptoKey`, or one of your own without `verifier()`,
    still trusts the journal as written: give both `signatures`. UPGRADING.md,
    "The recorder and the checkpoint builder can verify what the journal
    holds", has the steps.
