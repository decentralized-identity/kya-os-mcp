kind: Fixed
body: |-
    **`resolveCard` refuses a malformed did:web DID before it reads
    anything, and a refused Card DID's reason says exactly what is wrong.**
    A did:web DID that was a DID URL, or held a character DID Core does not
    allow, was fetched and then failed as an identity mismatch; it now
    fails at once with the DID rule's reason. A value that is not a DID URL
    is no longer called one, and white space other than a space is named by
    its code point. UPGRADING.md, "Each Card DID is a DID as DID Core
    writes it", has the reasons.
time: 2026-11-17T00:35:00.000000-06:00
