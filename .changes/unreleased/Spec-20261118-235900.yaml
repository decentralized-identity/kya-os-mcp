kind: Spec
body: |-
    **Conformance suite 1.13.0 adds thirteen vectors, and SPEC.md §7.8 says
    what a holder's request proof that names its delegation is held to.**
    `delegation-chain` refuses a subject id holding a control character and
    an `issuanceDate` past the tolerance. `signed-proof` refuses a request
    proof that names one delegation presented beside another, and a
    refusal whose chain digest covers the failing leaf alone. `entity-card`
    refuses a hop past its `expirationDate`, past its proof's `expires`,
    or before its `issuanceDate`, and covers the parent digest: stated and
    valid, absent, stated by a hop presented under a parent reissued under
    the same id, stated by a root, and stated as `null` on a root or a leaf,
    which counts as stated. A verifier MUST refuse a request proof whose
    `delegationRef` or `delegationChainDigest` names a delegation other
    than the one the call presents, and a holder SHOULD name it. The Python
    cross-check reads the new `signed-proof` vectors and every parent
    digest, and now tests whether `parentCredentialDigest` is present
    rather than reading `null` as absent.
