kind: Upgrading
body: |-
    **The verifier `createStatusListProofVerifier` or
    `createDelegationProofVerifier` builds throws when the signer's DID
    document cannot be read.** It answered `false`, as for a proof that does
    not verify, and let a resolver's own error through. It now throws an
    error whose message is `Could not resolve issuer DID: "<did>"` and whose
    `code`, which does not enumerate, says why, such as `did_unavailable`,
    `did_invalid` or `host_refused`, or past the deadline one that reads
    `DID resolution deadline exceeded`, coded `deadline_exceeded`; a proof
    that does not verify still answers `false`. `createRevocationChecker`
    answers such a list revoked and not fresh with that code and reason, and
    `verifyRequestDelegation` and `requireDelegation` refuse such a hop with
    that `refusalCode` and `hop <n>: Could not resolve issuer DID: "<did>"`,
    where they said `hop <n>: proof did not verify`. Code that calls such a
    verifier itself must catch the throw. UPGRADING.md, "Code that calls the
    verifier `createStatusListProofVerifier` or
    `createDelegationProofVerifier` builds", has the detail.
time: 2026-11-16T16:10:00.000000-06:00
