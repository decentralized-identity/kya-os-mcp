<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirm revocation</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14161a; color: #e9edf2;
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width: min(30rem, 92vw); padding: 1.75rem; background: #1c1f25; border: 1px solid #2c313a; border-radius: 12px; }
  h1 { margin: 0 0 .25rem; font-size: 1.2rem; }
  p.sub { margin: 0 0 1.25rem; color: #9aa4b2; font-size: .9rem; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .35rem .9rem; margin: 0 0 1.25rem;
       font-size: .85rem; word-break: break-all; }
  dt { color: #9aa4b2; } dd { margin: 0; }
  #status { margin: 0 0 1rem; padding: .7rem .85rem; border-radius: 8px; background: #23272f; font-size: .88rem; }
  #status.bad { background: #3a1f22; color: #ffb4b4; }
  #status.good { background: #16301f; color: #9be8b4; }
  button { font: inherit; padding: .55rem 1.1rem; border-radius: 8px; border: 1px solid #3a4150;
           background: #262b33; color: inherit; cursor: pointer; }
  button.danger { background: #7f1d24; border-color: #a12a32; }
  button[disabled] { opacity: .5; cursor: default; }
</style>
<main>
  <h1>Confirm revocation</h1>
  <p class="sub">The Responsible Party is withdrawing this agent's authority. Touch your registered key to sign the intent.</p>
  <dl id="intent" hidden>
    <dt>Grant</dt><dd id="i-index"></dd>
    <dt>Agent</dt><dd id="i-agent"></dd>
    <dt>Scope</dt><dd id="i-scope"></dd>
  </dl>
  <p id="status">Requesting a signing challenge…</p>
  <button id="retry" hidden>Try again</button>
  <button id="close" class="danger" hidden>Close</button>
</main>
<script>
  // Served by the Responsible Party so navigator.credentials.get runs on the same
  // origin the passkey was registered against. A passkey scoped to this hub cannot
  // be requested from the merchant console's origin, which is why this is a popup.
  const MERCHANT_ORIGIN = '__MERCHANT_ORIGIN__';
  const $ = (id) => document.getElementById(id);
  const b64uToBuf = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
  const bufToB64u = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  function say(text, kind) { const el = $('status'); el.textContent = text; el.className = kind || ''; }
  function tellOpener(payload) {
    try { if (window.opener && MERCHANT_ORIGIN) window.opener.postMessage({ kyaos: 'revocation', ...payload }, MERCHANT_ORIGIN); } catch { /* opener gone */ }
  }
  async function post(path, body) {
    const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify(body || {}) });
    return res.json();
  }

  async function ceremony() {
    $('retry').hidden = true;
    say('Requesting a signing challenge…');
    const ch = await post('/api/rp/revoke/challenge', {});
    if (ch.error) throw new Error(ch.message || ch.error);
    const preview = ch.intentPreview || {};
    $('i-index').textContent = '#' + preview.index;
    $('i-agent').textContent = preview.agentDid || preview.agent || '—';
    $('i-scope').textContent = preview.productClass || preview.scope || '—';
    $('intent').hidden = false;
    say('Touch your registered key to confirm.');

    const o = ch.options;
    const publicKey = {
      challenge: b64uToBuf(o.challenge), timeout: o.timeout, rpId: o.rpId, userVerification: o.userVerification,
      allowCredentials: (o.allowCredentials || []).map((cr) => ({ id: b64uToBuf(cr.id), type: 'public-key', ...(cr.transports ? { transports: cr.transports } : {}) })),
    };
    let cred;
    try {
      cred = await navigator.credentials.get({ publicKey });
    } catch {
      cred = null;
    }
    if (!cred) {
      // Nothing was signed, so nothing was sent. The grant is untouched.
      say('Passkey confirmation cancelled. No revocation was sent.', 'bad');
      tellOpener({ state: 'cancelled' });
      $('retry').hidden = false; $('close').hidden = false;
      return;
    }

    say('Verifying the assertion…');
    const r = cred.response;
    const assertion = {
      id: cred.id, rawId: bufToB64u(cred.rawId), type: cred.type,
      clientExtensionResults: cred.getClientExtensionResults ? cred.getClientExtensionResults() : {},
      response: {
        clientDataJSON: bufToB64u(r.clientDataJSON), authenticatorData: bufToB64u(r.authenticatorData),
        signature: bufToB64u(r.signature), ...(r.userHandle ? { userHandle: bufToB64u(r.userHandle) } : {}),
      },
    };
    const result = await post('/api/rp/revoke/execute', { nonce: ch.nonce, response: assertion });
    if (result.error) throw new Error(result.message || result.error);
    say('Revoked grant #' + result.index + ' · ' + (result.authenticator || 'registered key'), 'good');
    tellOpener({ state: 'revoked', result });
    $('close').hidden = false;
    setTimeout(() => window.close(), 1500);
  }

  $('retry').onclick = () => { ceremony().catch(fail); };
  $('close').onclick = () => window.close();
  function fail(e) {
    say(e.message || 'Revocation failed.', 'bad');
    tellOpener({ state: 'error', message: e.message || 'Revocation failed.' });
    $('retry').hidden = false; $('close').hidden = false;
  }
  ceremony().catch(fail);
</script>
