version: 2
updates:
  # npm — the package itself, its tooling, and every example workspace.
  # The examples carry their own manifests/lockfiles; without listing them
  # here they accumulate alerts with no update PRs (130 of them, once).
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/examples/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by the CI/coverage/conformance workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
