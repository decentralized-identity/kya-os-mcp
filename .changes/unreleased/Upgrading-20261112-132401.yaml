kind: Upgrading
body: |-
    **A status list is now held to the credential it covers, so a status
    check that passed on 1.22.0 can deny.** A reader that verifies a list's
    proof reads the list only when its issuer is the credential's own, the
    chain's root where the verifier pins it, or one `statusListIssuers`
    names, and only when the list states its URL as its `id`. Pin the root
    or configure `statusListIssuers` where another issuer signs your lists,
    and re-issue each list with its URL as its `id`. A `statusListIndex`
    must be a string of decimal digits, an entry of another `statusPurpose`
    reads as revoked, and `verifyCard` takes only a literal `true` from an
    `accountabilityVerifier`. A custom `StatusListResolver` holds a list to
    its credential only if it applies `acceptStatusList`. UPGRADING.md,
    "Status lists held to their credential", takes each setup in turn.
