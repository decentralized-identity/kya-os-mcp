kind: Added
body: |-
    **Every refusal of a delegation, its chain, its status or an Entity Card
    carries a stable code, and says whether it is transient.** A reason is
    text for people, and its wording changed in this release; branch on the
    code instead. `REFUSAL_CODES` lists 21 codes, exported with
    `RefusalCode`, `isRefusalCode` and `isTransientRefusal` from
    `@kya-os/mcp`, `@kya-os/mcp/delegation` and `@kya-os/mcp/card`. The
    refusals of the delegation and Entity Card verifiers carry `code` and
    `transient`, and a rejection from `verifyRequestDelegation`,
    `requireDelegation` or `readDelegationChain` carries `refusalCode` and
    `transient`. Four codes are transient, `did_unavailable`,
    `status_unavailable`, `deadline_exceeded` and `runtime_error`: the
    verifier could not decide, and the same request may pass later. A custom
    signature verifier, chain verifier or `BitstringRevocationChecker` may
    name a code in its answer. Every revoked answer of the checker
    `createRevocationChecker` builds, a set bit included, now carries `code`
    and `transient`, so a test that compares one exactly must allow for
    them, and a server that returns a `requireDelegation` rejection to its
    client as it is now sends `refusalCode` and `transient` too. The
    delegation gate of `withKyaOs` records the code as
    `authorization.verificationCode` on `delegation.rejected`, and logs it
    as `{ code, transient }` beside a reason it now keeps up to 512 UTF-16
    code units. What the gate sends a client is unchanged. UPGRADING.md,
    "Refusal codes", has the catalog.
