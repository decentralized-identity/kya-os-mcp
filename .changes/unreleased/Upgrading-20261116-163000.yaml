kind: Upgrading
body: |-
    **A server that gates a tool on a delegation must name the issuers it
    trusts.** Without `delegation.trustedRootIssuers` the gate accepts a
    delegation from any issuer, including one an agent signs for itself,
    and 1.22.0 only warned at startup. Outside development,
    `wrapWithDelegation` now throws while it is unset, and the error names
    each fix: set `delegation.trustedRootIssuers` to the DIDs allowed to
    grant authority; in local development, set `development: true`; to
    accept any issuer anyway, set the new
    `delegation.allowAnyRootIssuer: true`. Either of the last two starts
    the server with one warning. A server that gates no tool on a
    delegation needs no setting and is no longer warned. An
    `allowAnyRootIssuer` that is not a boolean, or one set to `true`
    beside `trustedRootIssuers`, throws a `TypeError` when the middleware
    is created. UPGRADING.md, "A server that gates tools on a delegation
    needs delegation.trustedRootIssuers", has each setup.
