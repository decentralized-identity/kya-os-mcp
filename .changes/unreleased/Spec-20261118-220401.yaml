kind: Spec
body: |-
    **SPEC.md §6.6 says how the reference issuer bounds a status list.**
    `StatusList2021Manager` states an `expirationDate` `listLifetimeMs` after
    it signs each version when that option is set, and `renewStatusList`
    republishes a list with a new end; without the option its lists state
    no end, as before.
