kind: Security
body: |-
    **A status list resolver or chain resolver that never answers can no
    longer hold a verification open.** `DelegationCredentialVerifier`
    waited on a `StatusListResolver` without a deadline, and
    `validateDelegationChain`, which the delegation gate runs, on
    `resolveDelegationChain`, so a stalled status service or chain store
    kept a gated call waiting without end, where a DID resolver was given 5
    seconds. Each now has the same 5 seconds. A `checkStatus` that has not
    answered by then denies the credential as `status_unresolvable`, and a
    `resolveDelegationChain` that has not is refused as a chain that could
    not be resolved. A resolver that can take longer, such as one that
    makes several reads in a row, now fails where it was slow. UPGRADING.md,
    "A custom `StatusListResolver` whose `checkStatus` can take longer than
    5 seconds" and "A `delegation.resolveDelegationChain`", has the
    reasons.
time: 2026-11-14T09:10:00.000000-06:00
