kind: Security
body: |-
    **Revoking or restoring a re-delegation no longer changes another
    delegation's status.** `DelegationGraphManager.registerDelegation` stored
    any status list entry it was given, and `CascadingRevocationManager` set
    or cleared that entry's bit, so a host that registered each submitted
    re-delegation with the entry its credential carries let the agent that
    signed it name another delegation's entry, its root's included: revoking
    the re-delegation revoked that delegation on the published list, and
    restoring it made a revoked credential read as live. The graph now
    refuses an entry another delegation is registered with, and the cascade
    never sets or clears a bit that belongs to a delegation outside what it
    revokes or restores, each with a `delegation_malformed` `RefusalError`.
    To record whose each entry is, pass `{ delegationId }` to
    `allocateStatusEntry` and the status list manager to the graph as
    `statusEntryOwners`. A host that registers each delegation with its own
    entry changes nothing. UPGRADING.md, "A delegation's status entry is the
    one allocated for it", has the detail.
