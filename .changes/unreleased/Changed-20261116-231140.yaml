kind: Changed
body: |-
    **A Card's DID members take only a DID as W3C DID Core writes one, so
    the Card's schema moves to `identity/card/v1.2.0`.** `id`,
    `responsibleParty`, `principal` and an attestation's `subject` and
    `issuer` no longer take a DID URL, such as a key id ending in `#key-1`,
    a character DID Core writes percent-encoded, or an empty last part. The
    published schema refuses each, and `EntityCardSchema` and `parseCard`
    refuse each with a reason that says what is wrong. `v1.1.0` stays
    published. UPGRADING.md, "Each Card DID is a DID as DID Core writes it",
    has each case.
time: 2026-11-16T23:11:40.321171-06:00
