name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Coverage
        run: npx vitest run --coverage

      # Blocks Vouched product-internal terms from leaking into the
      # public spec-reference tree. `@kya-os` is no longer in the
      # blocklist: this package's own scope is `@kya-os/mcp`, so the
      # term would trip on every JSDoc package header. Other
      # `@kya-os/<product>` packages (e.g. `@kya-os/argus`,
      # `@kya-os/agentshield`) are still caught by their product
      # substring (`argus`, `agentshield`, etc.), so removing the
      # scope-level entry doesn't open a hole — it just stops the
      # check tripping on the package's own name.
      - name: Product contamination check
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # -i (case-insensitive) keeps this consistent with the Windows
          # (PowerShell Select-String) check below, which is case-insensitive
          # by default — so a match fails on every OS, not just Windows.
          if grep -rni "kta\|bouncer\|argus\|agentshield\|knowthat" src/ --include='*.ts'; then
            echo "::error::Product contamination found in src/"
            exit 1
          fi
          echo "No product contamination found"

      - name: Product contamination check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $matches = Get-ChildItem -Path src -Recurse -Include "*.ts" |
            Select-String -Pattern "kta|bouncer|argus|agentshield|knowthat"
          if ($matches) {
            Write-Host "::error::Product contamination found in src/"
            exit 1
          }
          Write-Host "No product contamination found"

  agentic-commerce:
    name: Agentic commerce (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    defaults:
      run:
        working-directory: examples/agentic-commerce
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      # Standalone example: install its locked public npm dependencies with no
      # sibling checkout, root-library aliases, or peer-validation bypass.
      - name: Install example dependencies from npm
        run: npm ci --no-audit --no-fund

      - name: Type check example
        run: npm run typecheck

      - name: Test consent, delegation, receipt and witnessed audit flows
        run: npm test

      - name: Set up browser test Python
        if: matrix.node-version == '22.x'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        if: matrix.node-version == '22.x'
        run: |
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium

      - name: Test real browser consent with a virtual FIDO2 authenticator
        if: matrix.node-version == '22.x'
        run: npm run test:webauthn:browser

      - name: Test account-bound passkey consent with fictional Google identity
        if: matrix.node-version == '22.x'
        run: npm run test:google:browser

      - name: Test shared live-feed recovery after fatal HTTP errors
        if: matrix.node-version == '22.x'
        run: python3 scripts/test-event-streams-browser.py --outdir docs/screenshots/event-streams

      - name: Upload browser evidence
        if: always() && matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: agentic-commerce-browser-evidence
          path: |
            examples/agentic-commerce/docs/screenshots/webauthn/
            examples/agentic-commerce/docs/screenshots/google-identity/
            examples/agentic-commerce/docs/screenshots/event-streams/
          if-no-files-found: ignore
          retention-days: 7

  conformance:
    name: Protocol Conformance Harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Type-check the harness against the live source (it is outside src/, so
      # the package build does not cover it).
      - name: Type check conformance harness
        run: pnpm run conformance:typecheck

      # Run every committed conformance vector through the reference adapter.
      # Exits non-zero on ANY mismatch — a tampered/negative vector the
      # implementation fails to reject, or a positive vector it fails to accept.
      - name: Run conformance vectors
        run: pnpm run conformance

      # The committed vector set is immutable at a suiteVersion: recompute the
      # suite hash from the raw vector bytes and fail if it drifts from
      # conformance/SUITE-MANIFEST.json without a suiteVersion bump. The vitest
      # suite enforces the same invariant; this step keeps it visible as its
      # own CI line.
      - name: Verify vector-set immutability
        run: node conformance/suite-hash.mjs --check

      # Independently re-verify the org.kya-os/proof@1 card-proof vector in a second
      # language (pure Python stdlib, shares no code with the TS reference) — proves
      # cross-language JCS (RFC 8785) + Ed25519 signature parity. Exits non-zero on mismatch.
      - name: Cross-language proof verification
        run: pnpm run conformance:verify:crosslang

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: typescript
      - uses: github/codeql-action/analyze@v4
